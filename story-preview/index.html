<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка истории</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="eyebrow">СЦЕНАРНАЯ МАСТЕРСКАЯ</span><h1 id="title">Загрузка истории…</h1></div><div class="toolbar"><button id="back">← Назад</button><button id="reset">Новое прохождение</button></div></header>
<div id="warning" role="status" hidden></div><main><section class="reading"><div class="scene-line"><span id="scene-title"></span><span id="progress"></span></div><div id="mode"></div><article id="window" aria-live="polite"></article><div id="controls"></div><details id="inspector"><summary>Сюжетные состояния · инструменты проверки</summary><p>Изменения применяются к следующим переходам. Переход по дереву показывает выбранный узел даже при невыполненном условии; он не восстанавливает предыдущие решения. Их можно выставить здесь.</p><div id="state-fields"></div><label>Портрет героя<select id="hero-portrait"></select></label><div id="notes"></div></details><div id="error" role="alert"></div></section>
<aside><div class="tree-heading"><h2>Дерево истории</h2><button id="locate">К текущему</button></div><input id="search" type="search" placeholder="Найти сцену или реплику" aria-label="Поиск по дереву"><div class="tree-tools"><button id="expand">Раскрыть всё</button><button id="collapse">Свернуть всё</button></div><nav id="tree" aria-label="Сцены, диалоги и ответы"></nav></aside></main><script type="module" src="/app.js"></script></body></html>
