<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Прозрачные иллюстрации — проверка</title>
    <style>
      body {
        margin: 24px;
        background: var(--color-base-white);
        color: var(--color-text-inverse);
        font: 16px system-ui;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 20px;
      }
      article {
        min-width: 0;
        border: 1px solid var(--color-text-muted);
        padding: 8px;
      }
      h2 {
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .surfaces {
        display: flex;
      }
      .surface {
        width: 50%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }
      .dark {
        background: var(--color-base-black) url("/terrain/grass.png") center /
          cover;
      }
      .light {
        background: var(--color-base-white);
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      main.small img {
        width: 40px;
        height: 40px;
      }
      main.small .surface {
        height: 64px;
        aspect-ratio: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Прозрачные иллюстрации</h1>
      <label
        >Группа
        <select id="group">
          <option value="">Все</option>
          <option value="item-">Предметы</option>
          <option value="action-">Базовые действия</option>
          <option value="creature-">Действия существ</option>
          <option value="skill-">Навыки</option>
        </select></label
      >
      <label><input type="checkbox" id="small" /> Миниатюры 40 px</label>
      <p id="status" role="status"></p>
    </header>
    <main id="gallery"></main>
    <script type="module">
      import "../../src/app/styles/palette.css";
      import plan from "../../art-prompts/transparent-v2/plan.json";
      const { jobs } = plan;
      const gallery = document.querySelector("#gallery");
      let loaded = 0;
      for (const job of jobs) {
        const card = document.createElement("article");
        card.dataset.id = job.id;
        const heading = document.createElement("h2");
        heading.textContent = job.id;
        const surfaces = document.createElement("div");
        surfaces.className = "surfaces";
        for (const background of ["dark", "light"]) {
          const surface = document.createElement("div");
          surface.className = `surface ${background}`;
          const image = document.createElement("img");
          image.alt = job.id;
          image.src = "/" + job.output.replace(/^public\//, "");
          if (background === "dark")
            image.onload = () => {
              loaded++;
              document.querySelector("#status").textContent =
                `Загружено ${loaded} / ${jobs.length}`;
            };
          surface.append(image);
          surfaces.append(surface);
        }
        card.append(heading, surfaces);
        gallery.append(card);
      }
      document.querySelector("#group").onchange = (event) => {
        for (const card of gallery.children)
          card.hidden = !card.dataset.id.startsWith(event.target.value);
      };
      document.querySelector("#small").onchange = (event) =>
        gallery.classList.toggle("small", event.target.checked);
    </script>
  </body>
</html>
